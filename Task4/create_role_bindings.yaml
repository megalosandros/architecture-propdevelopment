---
# Namespace: sales
apiVersion: v1
kind: Namespace
metadata:
  name: sales
  labels:
    app: propdevelopment
    domain: sales
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: developer-sales
  namespace: sales
  labels:
    app: propdevelopment
    component: rbac
  annotations:
    description: "Полный доступ для DevOps/разработчиков в namespace sales (витрина, CRM, онлайн-сделки)."
subjects:
- kind: ServiceAccount
  name: devops-developer-sa
  namespace: propdevelopment
roleRef:
  kind: ClusterRole
  name: namespace-developer
  apiGroup: rbac.authorization.k8s.io

---
# Namespace: tenant-services
apiVersion: v1
kind: Namespace
metadata:
  name: tenant-services
  labels:
    app: propdevelopment
    domain: tenant
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: developer-tenant
  namespace: tenant-services
  labels:
    app: propdevelopment
    component: rbac
  annotations:
    description: "Полный доступ для DevOps/разработчиков в namespace tenant-services (мобильное приложение, ЖКХ)."
subjects:
- kind: ServiceAccount
  name: devops-developer-sa
  namespace: propdevelopment
roleRef:
  kind: ClusterRole
  name: namespace-developer
  apiGroup: rbac.authorization.k8s.io

---
# ==========================================
# Business Reader — просмотр всего кластера (без секретов)
# ==========================================
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: business-reader-binding
  labels:
    app: propdevelopment
    component: rbac
  annotations:
    description: "Режим только для чтения для бизнес-аналитиков и менеджеров. Без доступа к секретам."
subjects:
- kind: ServiceAccount
  name: business-reader-sa
  namespace: propdevelopment
roleRef:
  kind: ClusterRole
  name: cluster-reader
  apiGroup: rbac.authorization.k8s.io