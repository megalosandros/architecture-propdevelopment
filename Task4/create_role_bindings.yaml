  namespace: finance
  labels:
    app: propdevelopment
    component: rbac
  annotations:
    description: "Доступ к секретам в namespace finance для специалиста по ИБ."
subjects:
- kind: ServiceAccount
  name: security-admin-sa
  namespace: propdevelopment
roleRef:
  kind: ClusterRole
  name: secrets-reader
  apiGroup: rbac.authorization.k8s.io

---
# Namespace: security
apiVersion: v1
kind: Namespace
metadata:
  name: security
  labels:
    app: propdevelopment
    component: security
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: secrets-reader-security
  namespace: security
  labels:
    app: propdevelopment
    component: rbac
  annotations:
    description: "Доступ к секретам в namespace security для специалиста по ИБ."
subjects:
- kind: ServiceAccount
  name: security-admin-sa
  namespace: propdevelopment
roleRef:
  kind: ClusterRole
  name: secrets-reader
