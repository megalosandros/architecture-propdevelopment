# ==========================================
# Platform Admin — полный доступ ко всему кластеру
# ==========================================
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: platform-admin-binding
  labels:
    app: propdevelopment
    component: rbac
  annotations:
    description: "Полный административный доступ для Platform/SRE команды."
subjects:
- kind: ServiceAccount
  name: platform-admin-sa
  namespace: propdevelopment
roleRef:
  kind: ClusterRole
  name: cluster-admin-custom
  apiGroup: rbac.authorization.k8s.io

---
# ==========================================
# Security Admin — просмотр секретов в namespace propdevelopment
# ==========================================
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: secrets-reader-propdevelopment
  namespace: propdevelopment
  labels:
    app: propdevelopment
    component: rbac
  annotations:
    description: "Доступ к секретам в namespace propdevelopment для специалиста по ИБ."
subjects:
- kind: ServiceAccount
  name: security-admin-sa
  namespace: propdevelopment
roleRef:
  kind: ClusterRole
  name: secrets-reader
  apiGroup: rbac.authorization.k8s.io

---
